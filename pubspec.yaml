name: proyecto_agro
description: "Agro+ - Plataforma de comercio agricola que conecta productores y compradores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.18.3

  flutter_dotenv: ^5.2.1

  go_router: ^14.8.1

  provider: ^6.1.2

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  uuid: ^4.5.1

  flutter_animate: ^4.5.0

  google_fonts: ^6.2.1

  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:

    - .env
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logotipo_oficial.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F9F6"
  adaptive_icon_foreground: "assets/images/logotipo_oficial.png"

