name: proyecto_agro
description: "Agro+ - Plataforma de comercio agrícola que conecta productores y compradores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.18.3

  # Variables de entorno (seguridad de credenciales)
  flutter_dotenv: ^5.2.1

  # Navegación declarativa
  go_router: ^14.8.1

  # Gestión de estado (MVVM)
  provider: ^6.1.2

  # UI y utilidades
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  uuid: ^4.5.1

  # Mapa y geolocalización (Bloque 4)
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets - el archivo .env debe declararse aquí
  assets:
    - .env
